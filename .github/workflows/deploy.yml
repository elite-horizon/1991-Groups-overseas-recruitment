name: Deploy 1991 Groups Website to AWS S3 & CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to S3 & Invalidate CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Sync Static Assets (CSS, JS, Images, Data) with Long Cache
        run: |
          aws s3 sync . s3://1991groups-recruitment \
            --exclude "*" \
            --include "css/*" \
            --include "js/*" \
            --include "images/*" \
            --include "data/*" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync HTML & Root Files with No-Cache
        run: |
          aws s3 sync . s3://1991groups-recruitment \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".agents/*" \
            --exclude ".gemini/*" \
            --exclude "DESIGN.md" \
            --exclude "README.md" \
            --exclude ".nojekyll" \
            --exclude ".gitignore" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3E2IRRVIFVPXO \
            --paths "/*"

